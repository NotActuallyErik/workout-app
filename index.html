<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#111418">
  <title>Push/Pull Log</title>
  <style>
:root {
  --bg: #f4f5f7;
  --card: #ffffff;
  --text: #15181c;
  --muted: #6b7280;
  --border: #d9dde3;
  --accent: #2563eb;
  --accent-text: #ffffff;
  --flag-bg: #dcfce7;
  --flag-text: #166534;
  --danger: #b91c1c;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111418;
    --card: #1b2026;
    --text: #e8eaed;
    --muted: #9aa3ae;
    --border: #2e353e;
    --accent: #5b8def;
    --accent-text: #0b0e12;
    --flag-bg: #14361f;
    --flag-text: #86efac;
    --danger: #f87171;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding-bottom: env(safe-area-inset-bottom);
}

header {
  position: sticky;
  top: 0;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 16px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}

h1 { font-size: 18px; margin: 0; }
h2 { font-size: 22px; margin: 0 0 4px; }
h3 { font-size: 16px; margin: 0; }

main {
  max-width: 560px;
  margin: 0 auto;
  padding: 16px;
}

button, select, input {
  font: inherit;
  color: inherit;
}

button {
  border: 1px solid var(--border);
  background: var(--card);
  border-radius: 8px;
  padding: 8px 12px;
  cursor: pointer;
}

nav { display: flex; gap: 6px; }
nav button.active,
.rotation button.next {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-text);
}

.rotation {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin: 12px 0;
}
.rotation button { padding: 8px 4px; font-size: 14px; }

.muted { color: var(--muted); font-size: 14px; }

.option {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
  font-size: 14px;
}

select {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 8px;
  max-width: 100%;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
}

.card-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}
.card-head .target { white-space: nowrap; color: var(--muted); font-size: 14px; }

.card select.swap { margin-top: 8px; width: 100%; }
.card select.swap + .link { display: block; margin-top: 6px; }

.flag {
  display: inline-block;
  margin-top: 8px;
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--flag-bg);
  color: var(--flag-text);
  font-size: 13px;
  font-weight: 600;
}

.prev { margin: 8px 0 10px; }

.set {
  display: grid;
  grid-template-columns: 48px 1fr 1fr;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.set label { color: var(--muted); font-size: 14px; }

.field { position: relative; }
.field input {
  width: 100%;
  padding: 10px 40px 10px 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 17px;
}
.field input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.field span {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  font-size: 13px;
  pointer-events: none;
}

.primary {
  width: 100%;
  padding: 14px;
  margin-top: 4px;
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-text);
  font-weight: 600;
  font-size: 17px;
}

.entry-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}
.entry-line { font-size: 14px; margin: 4px 0; }
.entry-line b { font-weight: 600; }

.link {
  border: 0;
  background: none;
  padding: 0;
  color: var(--danger);
  font-size: 14px;
}

.data-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }

nav button { padding: 8px 10px; }

.edit-set { grid-template-columns: 48px 1fr 1fr 32px; }
.edit-set .link, .add-set { color: var(--muted); }
.add-set { margin-top: 4px; }

.weight-form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.weight-form input[type=date] {
  width: 100%; padding: 10px; background: var(--card);
  border: 1px solid var(--border); border-radius: 8px; font-size: 17px;
}
.chart { width: 100%; height: auto; margin: 12px 0; }
.chart polyline { fill: none; stroke: var(--accent); stroke-width: 2; }
.chart circle { fill: var(--accent); }
.chart text { fill: var(--muted); font-size: 11px; }
.w-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); }
.w-row:last-child { border-bottom: 0; }
.w-actions { display: flex; gap: 12px; }
.w-actions .link { color: var(--muted); }
.w-actions .link.del { color: var(--danger); }

#toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  background: var(--text);
  color: var(--bg);
  padding: 10px 16px;
  border-radius: 999px;
  font-size: 14px;
  max-width: calc(100vw - 32px);
}
  </style>
</head>
<body>
  <header>
    <h1>Push/Pull Log</h1>
    <nav>
      <button data-view="workout" class="active">Workout</button>
      <button data-view="history">History</button>
      <button data-view="weight">Weight</button>
    </nav>
  </header>

  <main id="workout"></main>
  <main id="history" hidden></main>
  <main id="weight" hidden></main>

  <div id="toast" hidden></div>

  <script>
'use strict';

// ---------- Program definition ----------

const GROUPS = {
  chest: 'Chest', shoulders: 'Shoulders', side_delts: 'Side delts', triceps: 'Triceps',
  lats: 'Lats', rows: 'Rows', rear_delts: 'Rear delts', biceps: 'Biceps',
  legs: 'Legs', calves: 'Calves', forearms: 'Forearms', traps: 'Traps', abs: 'Abs',
};

// Add-exercise picker: category -> muscle groups shown under it.
const CATEGORIES = [
  ['Chest', ['chest']],
  ['Shoulders', ['shoulders', 'side_delts']],
  ['Arms', ['triceps', 'biceps', 'forearms']],
  ['Back', ['lats', 'rows', 'rear_delts', 'traps']],
  ['Misc', ['legs', 'calves', 'abs']],
];

const EXERCISES = {
  chest_press:        { group: 'chest',      name: 'Machine chest press',            sets: 3, min: 8,  max: 12 },
  incline_machine:    { group: 'chest',      name: 'Incline machine press',          sets: 3, min: 8,  max: 12 },
  incline_db:         { group: 'chest',      name: 'Incline dumbbell press',         sets: 3, min: 8,  max: 12 },
  db_bench:           { group: 'chest',      name: 'Dumbbell bench press',           sets: 3, min: 8,  max: 12 },
  pec_deck:           { group: 'chest',      name: 'Pec deck',                       sets: 3, min: 10, max: 15 },
  cable_fly:          { group: 'chest',      name: 'Cable fly',                      sets: 3, min: 10, max: 15 },
  barbell_bench:      { group: 'chest',      name: 'Barbell bench press',            sets: 3, min: 6,  max: 10 },
  dips:               { group: 'chest',      name: 'Chest dips',                     sets: 3, min: 8,  max: 12 },
  pushup:             { group: 'chest',      name: 'Push-up',                        sets: 3, min: 10, max: 20 },

  db_shoulder_press:  { group: 'shoulders',  name: 'Seated dumbbell shoulder press', sets: 3, min: 8,  max: 12 },
  machine_shoulder:   { group: 'shoulders',  name: 'Machine shoulder press',         sets: 3, min: 8,  max: 12 },
  arnold_press:       { group: 'shoulders',  name: 'Arnold press',                   sets: 3, min: 8,  max: 12 },
  barbell_ohp:        { group: 'shoulders',  name: 'Barbell overhead press',         sets: 3, min: 6,  max: 10 },

  cable_lateral:      { group: 'side_delts', name: 'Cable lateral raise',            sets: 3, min: 12, max: 15 },
  db_lateral:         { group: 'side_delts', name: 'Dumbbell lateral raise',         sets: 3, min: 12, max: 15 },
  machine_lateral:    { group: 'side_delts', name: 'Machine lateral raise',          sets: 3, min: 12, max: 15 },

  cable_pushdown:     { group: 'triceps',    name: 'Cable triceps pushdown',         sets: 3, min: 10, max: 15 },
  triceps_machine:    { group: 'triceps',    name: 'Triceps extension machine',      sets: 3, min: 10, max: 15 },
  rope_pushdown:      { group: 'triceps',    name: 'Rope pushdown',                  sets: 3, min: 10, max: 15 },
  overhead_ext:       { group: 'triceps',    name: 'Overhead cable extension',       sets: 3, min: 10, max: 15 },
  skullcrusher:       { group: 'triceps',    name: 'Skullcrusher',                   sets: 3, min: 8,  max: 12 },
  close_grip_bench:   { group: 'triceps',    name: 'Close-grip bench press',         sets: 3, min: 8,  max: 12 },

  lat_pulldown:       { group: 'lats',       name: 'Lat pulldown',                   sets: 3, min: 8,  max: 12 },
  close_pulldown:     { group: 'lats',       name: 'Close-grip pulldown',            sets: 3, min: 8,  max: 12 },
  neutral_pulldown:   { group: 'lats',       name: 'Neutral-grip pulldown',          sets: 3, min: 8,  max: 12 },
  assisted_pullup:    { group: 'lats',       name: 'Assisted pull-up',               sets: 3, min: 8,  max: 12 },

  cable_row:          { group: 'rows',       name: 'Seated cable row',               sets: 3, min: 8,  max: 12 },
  row_machine:        { group: 'rows',       name: 'Chest-supported row (machine)',  sets: 3, min: 8,  max: 12 },
  row_db:             { group: 'rows',       name: 'Chest-supported row (dumbbell)', sets: 3, min: 8,  max: 12 },
  single_arm_row:     { group: 'rows',       name: 'Single-arm dumbbell row',        sets: 3, min: 8,  max: 12 },
  barbell_row:        { group: 'rows',       name: 'Barbell row',                    sets: 3, min: 6,  max: 10 },
  tbar_row:           { group: 'rows',       name: 'T-bar row',                      sets: 3, min: 8,  max: 12 },

  face_pull:          { group: 'rear_delts', name: 'Cable face pull',                sets: 3, min: 12, max: 15 },
  reverse_pec_deck:   { group: 'rear_delts', name: 'Reverse pec deck',               sets: 3, min: 12, max: 15 },
  rear_delt_fly:      { group: 'rear_delts', name: 'Rear delt cable fly',            sets: 3, min: 12, max: 15 },

  db_curl:            { group: 'biceps',     name: 'Dumbbell curl',                  sets: 3, min: 10, max: 15 },
  hammer_curl:        { group: 'biceps',     name: 'Hammer curl',                    sets: 3, min: 10, max: 15 },
  cable_curl:         { group: 'biceps',     name: 'Cable curl',                     sets: 3, min: 10, max: 15 },
  preacher_curl:      { group: 'biceps',     name: 'Preacher curl machine',          sets: 3, min: 10, max: 15 },
  incline_curl:       { group: 'biceps',     name: 'Incline dumbbell curl',          sets: 3, min: 10, max: 15 },
  wrist_curl:         { group: 'forearms',   name: 'Wrist curl',                     sets: 3, min: 12, max: 20 },
  reverse_curl:       { group: 'forearms',   name: 'Reverse curl',                   sets: 3, min: 10, max: 15 },
  db_shrug:           { group: 'traps',      name: 'Dumbbell shrug',                 sets: 3, min: 10, max: 15 },
  pullup:             { group: 'lats',       name: 'Pull-up',                        sets: 3, min: 6,  max: 10 },

  leg_press:          { group: 'legs',       name: 'Leg press',                      sets: 2, min: 8,  max: 12 },
  hack_squat:         { group: 'legs',       name: 'Hack squat',                     sets: 2, min: 8,  max: 12 },
  leg_extension:      { group: 'legs',       name: 'Leg extension',                  sets: 2, min: 10, max: 15 },
  leg_curl:           { group: 'legs',       name: 'Lying leg curl',                 sets: 2, min: 10, max: 15 },
  rdl:                { group: 'legs',       name: 'Romanian deadlift',              sets: 2, min: 8,  max: 12 },
  cable_crunch:       { group: 'abs',        name: 'Cable crunch',                   sets: 3, min: 10, max: 15 },
  hanging_leg_raise:  { group: 'abs',        name: 'Hanging leg raise',              sets: 3, min: 8,  max: 15 },
  ab_wheel:           { group: 'abs',        name: 'Ab wheel rollout',               sets: 3, min: 8,  max: 15 },

  calf_raise:         { group: 'calves',     name: 'Standing calf raise',            sets: 2, min: 8,  max: 12 },
  seated_calf_raise:  { group: 'calves',     name: 'Seated calf raise',              sets: 2, min: 8,  max: 12 },
};

// Each slot names its default exercise; it can be swapped for any exercise in the same group.
const SESSIONS = [
  { id: 'pushA', name: 'Push A', slots: ['chest_press', 'db_shoulder_press', 'cable_lateral', 'cable_pushdown'] },
  { id: 'pullA', name: 'Pull A', slots: ['lat_pulldown', 'cable_row', 'face_pull', 'db_curl'] },
  { id: 'pushB', name: 'Push B', slots: ['incline_machine', 'machine_shoulder', 'db_lateral', 'triceps_machine'] },
  { id: 'pullB', name: 'Pull B', slots: ['row_machine', 'close_pulldown', 'reverse_pec_deck', 'hammer_curl'] },
];

const LEG_SLOTS = ['leg_press', 'calf_raise'];

const ADD_CUSTOM = '__add';

// ---------- State ----------

const STORAGE_KEY = 'pushpull-log-v1';

const defaultState = () => ({
  next: 0,          // index into SESSIONS
  legDay: 'off',    // 'off' | 'pullA' | 'pullB'
  swaps: {},        // 'sessionId:slotIndex' -> exercise id
  custom: {},       // exercise id -> { group, name, sets, min, max, hidden? }
  draft: {},        // exercise id -> [{ w, r }] (raw input strings)
  extras: [],       // exercise ids added to the current workout only
  weights: [],      // [{ date: 'YYYY-MM-DD', kg }]
  history: [],      // [{ id, date, session, exercises: [{ id, sets: [{ w, r }] }] }]
});

let state = load();

function load() {
  try {
    return { ...defaultState(), ...JSON.parse(localStorage.getItem(STORAGE_KEY)) };
  } catch {
    return defaultState();
  }
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

// ---------- Logic ----------

const exDef = id => EXERCISES[id] || state.custom[id];

function groupExercises(group) {
  const builtIn = Object.keys(EXERCISES).filter(id => EXERCISES[id].group === group);
  const custom = Object.keys(state.custom).filter(id => state.custom[id].group === group && !state.custom[id].hidden);
  return builtIn.concat(custom);
}

function currentExercises() {
  const session = SESSIONS[state.next];
  const slots = session.slots.map((def, i) => ({ key: `${session.id}:${i}`, def }));
  if (state.legDay === session.id) {
    LEG_SLOTS.forEach((def, i) => slots.push({ key: `legs:${i}`, def }));
  }
  const regular = slots.map(slot => {
    const group = EXERCISES[slot.def].group;
    const options = groupExercises(group);
    const chosen = state.swaps[slot.key];
    return { key: slot.key, group, options, id: options.includes(chosen) ? chosen : slot.def };
  });
  const extras = state.extras.map(id => ({ key: `extra:${id}`, group: exDef(id).group, options: [], id, extra: true }));
  return regular.concat(extras);
}

// New exercise inherits sets and rep range from the one it replaces.
function addCustom(slotKey) {
  const slot = currentExercises().find(s => s.key === slotKey);
  const name = (prompt(`Name of new ${GROUPS[slot.group].toLowerCase()} exercise:`) || '').trim();
  if (!name) return;
  const { sets, min, max } = exDef(slot.id);
  const id = `custom_${Date.now()}`;
  state.custom[id] = { group: slot.group, name, sets, min, max };
  state.swaps[slotKey] = id;
}

function pickerOptions(placeholder) {
  return `<option value="">${placeholder}</option>` + CATEGORIES.map(([label, groups]) =>
    `<optgroup label="${label}">${groups.flatMap(g => groupExercises(g)).map(id =>
      `<option value="${id}">${esc(exDef(id).name)}</option>`).join('')}</optgroup>`).join('');
}

function lastLog(exId) {
  for (let i = state.history.length - 1; i >= 0; i--) {
    const found = state.history[i].exercises.find(e => e.id === exId);
    if (found) return { date: state.history[i].date, sets: found.sets };
  }
  return null;
}

// Rule 3: all prescribed sets at the top of the rep range.
function readyForIncrease(exId, sets) {
  const ex = exDef(exId);
  return sets.length >= ex.sets && sets.every(s => s.r >= ex.max);
}

function parseNum(str) {
  const n = parseFloat(String(str).replace(',', '.'));
  return Number.isFinite(n) ? n : null;
}

function loggedSets(exId) {
  return (state.draft[exId] || [])
    .map(s => ({ w: parseNum(s.w) ?? 0, r: parseNum(s.r) }))
    .filter(s => s.r !== null && s.r > 0);
}

function draftFor(exId) {
  if (!state.draft[exId]) {
    const last = lastLog(exId);
    const keepWeight = last && !readyForIncrease(exId, last.sets);
    state.draft[exId] = Array.from({ length: exDef(exId).sets }, (_, i) => {
      const prev = last && (last.sets[i] || last.sets[last.sets.length - 1]);
      return { w: keepWeight ? String(prev.w) : '', r: '' };
    });
  }
  return state.draft[exId];
}

function finishSession() {
  const exercises = currentExercises()
    .map(e => ({ id: e.id, sets: loggedSets(e.id) }))
    .filter(e => e.sets.length);
  if (!exercises.length) return toast('Log at least one set first');

  const session = SESSIONS[state.next];
  state.history.push({ id: Date.now(), date: new Date().toISOString(), session: session.id, exercises });
  state.next = (state.next + 1) % SESSIONS.length;
  state.draft = {};
  state.extras = [];
  save();
  renderWorkout();
  window.scrollTo(0, 0);
  toast(`${session.name} saved. Next: ${SESSIONS[state.next].name}`);
}

// ---------- Rendering ----------

const $workout = document.getElementById('workout');
const $history = document.getElementById('history');

const fmtDate = iso => new Date(iso).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
const fmtSets = sets => sets.map(s => `${s.w}×${s.r}`).join(', ');
const esc = str => String(str).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const exName = id => exDef(id) ? exDef(id).name : id;
const localDay = iso => { const d = new Date(iso); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const todayStr = () => localDay(new Date().toISOString());
const sessionName = id => (SESSIONS.find(s => s.id === id) || { name: id }).name;

function renderWorkout() {
  const session = SESSIONS[state.next];

  const rotation = SESSIONS.map((s, i) =>
    `<button data-next="${i}" class="${i === state.next ? 'next' : ''}">${s.name}</button>`).join('');

  const legOptions = [['off', 'Off'], ['pullA', 'On Pull A'], ['pullB', 'On Pull B']].map(([v, label]) =>
    `<option value="${v}" ${state.legDay === v ? 'selected' : ''}>${label}</option>`).join('');

  const cards = currentExercises().map(slot => {
    const ex = exDef(slot.id);
    const last = lastLog(slot.id);
    const flagged = last && readyForIncrease(slot.id, last.sets);
    const draft = draftFor(slot.id);

    const swap = slot.extra ? `<button class="link" data-unextra="${slot.id}">Remove from this workout</button>` : `
      <select class="swap" data-swap="${slot.key}">
        <optgroup label="${GROUPS[slot.group]}">${slot.options.map(id =>
          `<option value="${id}" ${id === slot.id ? 'selected' : ''}>${esc(exDef(id).name)}</option>`).join('')}</optgroup>
        <option value="${ADD_CUSTOM}">+ Add your own…</option>
      </select>
      ${state.custom[slot.id] ? `<button class="link" data-remove="${slot.id}">Remove custom exercise</button>` : ''}`;

    const rows = draft.map((set, i) => {
      const prev = last && last.sets[i];
      return `
        <div class="set">
          <label>Set ${i + 1}</label>
          <div class="field">
            <input type="text" inputmode="decimal" data-ex="${slot.id}" data-set="${i}" data-field="w"
                   value="${set.w}" placeholder="${prev ? prev.w : ''}">
            <span>kg</span>
          </div>
          <div class="field">
            <input type="text" inputmode="numeric" data-ex="${slot.id}" data-set="${i}" data-field="r"
                   value="${set.r}" placeholder="${prev && !flagged ? prev.r : ex.min}">
            <span>reps</span>
          </div>
        </div>`;
    }).join('');

    return `
      <section class="card">
        <div class="card-head">
          <h3>${esc(ex.name)}</h3>
          <span class="target">${ex.sets} × ${ex.min}–${ex.max}</span>
        </div>
        ${swap}
        ${flagged ? '<div class="flag">↑ Increase weight today</div>' : ''}
        <div class="prev muted">${last ? `Last (${fmtDate(last.date)}): ${fmtSets(last.sets)} kg` : 'No previous log'}</div>
        ${rows}
        <div class="flag" data-hint="${slot.id}" hidden>All sets at ${ex.max} — increase weight next time</div>
      </section>`;
  }).join('');

  $workout.innerHTML = `
    <h2>${session.name}</h2>
    <div class="muted">Next in rotation. Tap another to override.</div>
    <div class="rotation">${rotation}</div>
    <div class="option">
      <label for="legDay">Leg add-on (leg press, calf raise)</label>
      <select id="legDay">${legOptions}</select>
    </div>
    ${cards}
    <div class="option">
      <label for="addEx">Add exercise to this workout</label>
      <select id="addEx">${pickerOptions('Choose…')}</select>
    </div>
    <button class="primary" id="finish">Finish session</button>`;

  currentExercises().forEach(e => updateHint(e.id));
  save();
}

function updateHint(exId) {
  const hint = $workout.querySelector(`[data-hint="${exId}"]`);
  if (hint) hint.hidden = !readyForIncrease(exId, loggedSets(exId));
}

function renderHistory() {
  if (editing) return renderEdit();
  const entries = state.history.slice().reverse().map(entry => `
    <section class="card">
      <div class="entry-head">
        <h3>${sessionName(entry.session)} <span class="muted">${fmtDate(entry.date)}</span></h3>
        <span class="w-actions">
          <button class="link" data-edit="${entry.id}">Edit</button>
          <button class="link del" data-delete="${entry.id}">Delete</button>
        </span>
      </div>
      ${entry.exercises.map(e =>
        `<div class="entry-line"><b>${esc(exDef(e.id) ? exDef(e.id).name : e.id)}</b><br>${fmtSets(e.sets)} kg</div>`).join('')}
    </section>`).join('');

  $history.innerHTML = `
    ${entries || '<p class="muted">No sessions logged yet.</p>'}
    <div class="data-actions">
      <button id="export">Export backup</button>
      <button id="import">Import backup</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>`;
}

// ---------- Edit past workout ----------

let editing = null; // { id, date, name, exercises: [{ id, sets: [{ w, r }] }] } with raw input strings

function startEdit(id) {
  const entry = state.history.find(h => String(h.id) === id);
  editing = {
    id: entry.id,
    date: localDay(entry.date),
    name: sessionName(entry.session),
    exercises: entry.exercises.map(e => ({ id: e.id, sets: e.sets.map(s => ({ w: String(s.w), r: String(s.r) })) })),
  };
  renderHistory();
  window.scrollTo(0, 0);
}

function renderEdit() {
  const cards = editing.exercises.map((ex, ei) => `
    <section class="card">
      <div class="entry-head">
        <h3>${esc(exName(ex.id))}</h3>
        <button class="link del" data-xrem="${ei}">Remove</button>
      </div>
      ${ex.sets.map((s, si) => `
        <div class="set edit-set">
          <label>Set ${si + 1}</label>
          <div class="field"><input type="text" inputmode="decimal" data-ei="${ei}" data-si="${si}" data-f="w" value="${esc(s.w)}"><span>kg</span></div>
          <div class="field"><input type="text" inputmode="numeric" data-ei="${ei}" data-si="${si}" data-f="r" value="${esc(s.r)}"><span>reps</span></div>
          <button class="link" data-srem="${ei}:${si}" aria-label="Remove set">✕</button>
        </div>`).join('')}
      <button class="link add-set" data-sadd="${ei}">+ Add set</button>
    </section>`).join('');

  $history.innerHTML = `
    <h2>Edit ${esc(editing.name)}</h2>
    <div class="option">
      <label for="editDate">Date</label>
      <input type="date" id="editDate" value="${editing.date}">
    </div>
    ${cards}
    <div class="option">
      <label for="editAdd">Add exercise</label>
      <select id="editAdd">${pickerOptions('Choose…')}</select>
    </div>
    <button class="primary" id="editSave">Save changes</button>
    <div class="data-actions"><button id="editCancel">Cancel</button></div>`;
}

function saveEdit() {
  const exercises = editing.exercises
    .map(e => ({ id: e.id, sets: e.sets.map(s => ({ w: parseNum(s.w) ?? 0, r: parseNum(s.r) })).filter(s => s.r !== null && s.r > 0) }))
    .filter(e => e.sets.length);
  if (!exercises.length) return toast('Log at least one set');

  const entry = state.history.find(h => h.id === editing.id);
  entry.exercises = exercises;
  if (editing.date && editing.date !== localDay(entry.date)) {
    entry.date = new Date(`${editing.date}T12:00`).toISOString();
  }
  state.history.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  state.draft = {}; // prefilled weights may depend on the edited session
  editing = null;
  save();
  renderHistory();
  toast('Workout updated');
}

// ---------- Body weight ----------

const $weight = document.getElementById('weight');

function weightChart(points) {
  if (points.length < 2) return '';
  const W = 520, H = 140, pad = 28;
  const kgs = points.map(p => p.kg);
  const lo = Math.min(...kgs), hi = Math.max(...kgs), span = hi - lo || 1;
  const x = i => pad + (i * (W - pad * 2)) / (points.length - 1);
  const y = kg => H - pad - ((kg - lo) / span) * (H - pad * 2);
  const coords = points.map((p, i) => `${x(i).toFixed(1)},${y(p.kg).toFixed(1)}`).join(' ');
  return `
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Body weight over time">
      <polyline points="${coords}"/>
      ${points.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.kg).toFixed(1)}" r="3"/>`).join('')}
      <text x="4" y="${y(hi) + 4}">${hi}</text>
      <text x="4" y="${y(lo) + 4}">${lo}</text>
    </svg>`;
}

function renderWeight() {
  const sorted = state.weights.slice().sort((a, b) => (a.date < b.date ? -1 : 1));
  const rows = sorted.map((w, i) => {
    const delta = i ? Math.round((w.kg - sorted[i - 1].kg) * 10) / 10 : null;
    const deltaText = delta === null || delta === 0 ? '' : ` <span class="muted">${delta > 0 ? '+' : ''}${delta}</span>`;
    return `
      <div class="w-row">
        <span>${fmtDate(`${w.date}T12:00`)}</span>
        <span><b>${w.kg} kg</b>${deltaText}</span>
        <span class="w-actions">
          <button class="link" data-wedit="${w.date}">Edit</button>
          <button class="link del" data-wdel="${w.date}">Delete</button>
        </span>
      </div>`;
  }).reverse().join('');

  $weight.innerHTML = `
    <h2>Body weight</h2>
    <div class="weight-form">
      <input type="date" id="wDate" value="${todayStr()}">
      <div class="field"><input type="text" inputmode="decimal" id="wKg" placeholder="${sorted.length ? sorted[sorted.length - 1].kg : ''}"><span>kg</span></div>
    </div>
    <button class="primary" id="wAdd">Log weight</button>
    ${weightChart(sorted.slice(-30))}
    <section class="card">${rows || '<p class="muted">No weigh-ins yet.</p>'}</section>`;
}

$weight.addEventListener('click', e => {
  const { wedit, wdel } = e.target.dataset;
  if (e.target.id === 'wAdd') {
    const kg = parseNum(document.getElementById('wKg').value);
    const date = document.getElementById('wDate').value;
    if (kg === null || kg <= 0 || !date) return toast('Enter a date and weight');
    state.weights = state.weights.filter(w => w.date !== date).concat({ date, kg });
    save();
    renderWeight();
  } else if (wedit) {
    const entry = state.weights.find(w => w.date === wedit);
    const kg = parseNum(prompt('Weight (kg):', entry.kg));
    if (kg === null || kg <= 0) return;
    entry.kg = kg;
    save();
    renderWeight();
  } else if (wdel) {
    if (!confirm('Delete this weigh-in?')) return;
    state.weights = state.weights.filter(w => w.date !== wdel);
    save();
    renderWeight();
  }
});

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2500);
}

// ---------- Events ----------

document.querySelector('nav').addEventListener('click', e => {
  const view = e.target.dataset.view;
  if (!view) return;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b === e.target));
  $workout.hidden = view !== 'workout';
  $history.hidden = view !== 'history';
  $weight.hidden = view !== 'weight';
  if (view === 'workout') renderWorkout();
  else if (view === 'history') renderHistory();
  else renderWeight();
});

$workout.addEventListener('input', e => {
  const { ex, set, field } = e.target.dataset;
  if (!ex) return;
  state.draft[ex][set][field] = e.target.value;
  save();
  updateHint(ex);
});

$workout.addEventListener('change', e => {
  if (e.target.id === 'addEx') {
    const id = e.target.value;
    if (!id) return;
    if (currentExercises().some(s => s.id === id)) toast('Already in this workout');
    else state.extras.push(id);
    renderWorkout();
  } else if (e.target.id === 'legDay') {
    state.legDay = e.target.value;
    renderWorkout();
  } else if (e.target.dataset.swap) {
    if (e.target.value === ADD_CUSTOM) addCustom(e.target.dataset.swap);
    else state.swaps[e.target.dataset.swap] = e.target.value;
    renderWorkout();
  }
});

$workout.addEventListener('click', e => {
  if (e.target.id === 'finish') {
    finishSession();
  } else if (e.target.dataset.next !== undefined) {
    state.next = Number(e.target.dataset.next);
    renderWorkout();
  } else if (e.target.dataset.unextra) {
    const id = e.target.dataset.unextra;
    state.extras = state.extras.filter(x => x !== id);
    delete state.draft[id];
    renderWorkout();
  } else if (e.target.dataset.remove) {
    if (!confirm('Remove this exercise from the list? Logged sessions are kept.')) return;
    state.custom[e.target.dataset.remove].hidden = true; // kept so history still shows its name
    renderWorkout();
  }
});

$history.addEventListener('input', e => {
  const { ei, si, f } = e.target.dataset;
  if (editing && ei !== undefined) editing.exercises[ei].sets[si][f] = e.target.value;
  else if (e.target.id === 'editDate') editing.date = e.target.value;
});

$history.addEventListener('click', e => {
  const d = e.target.dataset;
  if (d.edit) {
    startEdit(d.edit);
  } else if (d.xrem !== undefined) {
    editing.exercises.splice(d.xrem, 1);
    renderEdit();
  } else if (d.srem !== undefined) {
    const [ei, si] = d.srem.split(':');
    editing.exercises[ei].sets.splice(si, 1);
    renderEdit();
  } else if (d.sadd !== undefined) {
    editing.exercises[d.sadd].sets.push({ w: '', r: '' });
    renderEdit();
  } else if (e.target.id === 'editSave') {
    saveEdit();
  } else if (e.target.id === 'editCancel') {
    editing = null;
    renderHistory();
  } else if (d.delete) {
    if (!confirm('Delete this session?')) return;
    state.history = state.history.filter(h => String(h.id) !== e.target.dataset.delete);
    state.draft = {}; // prefilled weights may depend on the deleted session
    save();
    renderHistory();
  } else if (e.target.id === 'export') {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `pushpull-backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  } else if (e.target.id === 'import') {
    document.getElementById('importFile').click();
  }
});

$history.addEventListener('change', async e => {
  if (e.target.id === 'editAdd') {
    const id = e.target.value;
    if (!id) return;
    if (editing.exercises.some(x => x.id === id)) toast('Already in this workout');
    else editing.exercises.push({ id, sets: Array.from({ length: exDef(id).sets }, () => ({ w: '', r: '' })) });
    return renderEdit();
  }
  if (e.target.id !== 'importFile' || !e.target.files[0]) return;
  try {
    const data = JSON.parse(await e.target.files[0].text());
    if (!Array.isArray(data.history)) throw new Error('missing history');
    if (!confirm(`Replace current data with backup (${data.history.length} sessions)?`)) return;
    state = { ...defaultState(), ...data };
    save();
    renderHistory();
    toast('Backup imported');
  } catch (err) {
    toast(`Import failed: ${err.message}`);
  }
});

renderWorkout();
  </script>
</body>
</html>
